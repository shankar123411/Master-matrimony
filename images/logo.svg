  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#mmGold)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.85"/>
  <circle cx="64" cy="64" r="47" fill="none" stroke="url(#mmGold)" stroke-width="0.9" opacity="0.5"/>

  <!-- Top Crown Diamond & Dots -->
  <path d="M64 17 L68 23 L64 29 L60 23 Z" fill="url(#mmGoldLight)"/>
  <circle cx="51" cy="24" r="1.8" fill="#fde68a" opacity="0.9"/>
  <circle cx="77" cy="24" r="1.8" fill="#fde68a" opacity="0.9"/>

  <!-- Aesthetic Royal Serif 'M' Monogram -->
  <path d="M34 86 L34 45 C34 42 36 40 39 40 L43 40 C45 40 46.5 41.2 47.6 43 L64 69 L80.4 43 C81.5 41.2 83 40 85 40 L89 40 C92 40 94 42 94 45 L94 86"
