  <!-- Serif Foot Accents -->
  <line x1="28" y1="86" x2="42" y2="86" stroke="url(#mmGold)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="86" y1="86" x2="100" y2="86" stroke="url(#mmGold)" stroke-width="3.5" stroke-linecap="round"/>

