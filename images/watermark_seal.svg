<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <path id="topArc" d="M 78,235 A 127,127 0 1,1 322,235" />
    <path id="bottomArc" d="M 70,260 A 143,143 0 0,0 330,260" />
  </defs>

  <!-- Outer Double Concentric Circles in Deep Crimson Red -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="6,4" opacity="0.85" />
  <circle cx="200" cy="200" r="158" fill="none" stroke="#b91c1c" stroke-width="2.8" opacity="0.95" />
  <circle cx="200" cy="200" r="106" fill="none" stroke="#b91c1c" stroke-width="2.2" opacity="0.9" />

  <!-- Circular Tamil Brand Name across Top Arch -->
  <text font-family="'Mukta Malar', 'Noto Sans Tamil', 'Tiro Tamil', Arial, sans-serif" font-size="20" font-weight="900" fill="#b91c1c" stroke="#b91c1c" stroke-width="0.8" paint-order="stroke fill" opacity="0.95" letter-spacing="1.0">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">✦ ★ மாஸ்டர் மணமாலை ★ ✦</textPath>
  </text>

  <!-- Circular Synthetic Contact across Bottom Arch -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="900" fill="#b91c1c" stroke="#b91c1c" stroke-width="0.8" paint-order="stroke fill" opacity="0.95" letter-spacing="2.0">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">★ +91 90000 00000 ★</textPath>
  </text>

  <!-- Clean Vector Crest in Center -->
  <circle cx="200" cy="188" r="52" fill="#fffbeb" stroke="#b91c1c" stroke-width="2.5" opacity="0.95" />
  <circle cx="200" cy="188" r="44" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3" />
  <path d="M174 208 V168 L200 192 L226 168 V208" fill="none" stroke="#b91c1c" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="200" y="264" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle" letter-spacing="2.2">MASTER MATRIMONY</text>
</svg>
